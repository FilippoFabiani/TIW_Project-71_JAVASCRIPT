<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Home Collaboratore</title>
    <link rel="stylesheet" href="global.css" />
    <link rel="stylesheet" href="collaborator.css" />

    <!-- Caricamento deterministico: defer esegue gli script in ordine dopo il
         parsing, cosi' TIW (utils.js) e' definito prima di collaborator.js. -->
    <script>
        window.APP_CONTEXT = window.location.pathname.replace(/\/homeCollaboratorJS$/, '/');
    </script>
    <script src="utils.js" defer></script>
    <script src="collaborator.js" defer></script>
</head>
<body>
    <!-- Saluto con nome e cognome + foto del tecnico (riempiti dal client dopo il
         caricamento dei dati). L'immagine e' inizialmente nascosta e resa visibile
         solo se disponibile. -->
    <div class="welcome">
        <img id="userPhoto" class="avatar" alt="Foto del collaboratore" hidden>
        <h1 id="greeting">Benvenuto</h1>
    </div>

    <nav>
        <!-- La HOME COLLABORATORE e' un'unica pagina: l'unico link richiesto e' il LOGOUT. -->
        <a href="Logout">Logout</a>
    </nav>

    <hr>

    <p id="errorMsg"></p>

    <section>
        <h2>I miei progetti</h2>
        <p class="hint">Seleziona un progetto per vedere e modificare le ore lavorate. Clicca una
            cella per editarla; il valore viene salvato automaticamente quando il puntatore esce
            dalla cella.</p>
        <ul id="projectList"></ul>
    </section>

    <hr>

    <!-- Tabella del progetto selezionato (mostrata lato client, senza ricaricare i dati) -->
    <section id="projectView"></section>

</body>
</html>
