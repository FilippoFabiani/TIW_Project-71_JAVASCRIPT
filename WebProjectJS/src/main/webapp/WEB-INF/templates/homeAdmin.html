<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Home Amministratore</title>
    <link rel="stylesheet" href="global.css" />
    <link rel="stylesheet" href="admin.css" />

    <!-- Caricamento deterministico: defer esegue gli script in ordine dopo il
         parsing, cosi' TIW (utils.js) e' definito prima di homeAdmin.js. -->
    <script>
        window.APP_CONTEXT = window.location.pathname.replace(/\/homeAdmin$/, '/');
    </script>
    <script src="utils.js" defer></script>
    <script src="homeAdmin.js" defer></script>
</head>
<body>

    <header>
        <h1 id="greeting">Home Amministratore</h1>
        <nav id="mainNav">
            <button type="button" data-view="view-builder" class="nav-btn active">Crea progetto</button>
            <button type="button" data-view="view-verify" class="nav-btn">Verifica progetti</button>
            <a href="#" id="logoutBtn">Logout</a>
        </nav>
    </header>

    <hr>

    <!-- =================== VISTA 1: CREAZIONE PROGETTO =================== -->
    <section id="view-builder" class="view">
        <h2>Creazione progetto</h2>

        <!-- Form iniziale: crea il progetto (solo lato client) -->
        <form id="np-form" action="#">
            <fieldset>
                <legend>Nuovo progetto</legend>
                <div class="row">
                    <label for="np-titolo">Titolo:</label>
                    <input type="text" id="np-titolo" required>
                </div>
                <div class="row">
                    <label for="np-durata">Durata (mesi):</label>
                    <input type="number" id="np-durata" min="1" step="1" value="12" required>
                </div>
                <div class="row">
                    <label for="np-responsabile">Responsabile:</label>
                    <select id="np-responsabile"><option value="">-- responsabile --</option></select>
                </div>
                <div class="actions">
                    <button type="button" id="btn-create-project">CREA PROGETTO</button>
                </div>
            </fieldset>
        </form>

        <!-- Toolbar: attiva quando esiste un progetto in costruzione -->
        <div class="toolbar" id="builder-toolbar" hidden>
            <button type="button" id="btn-undo" disabled>&#8630; Undo</button>
            <button type="button" id="btn-redo" disabled>&#8631; Redo</button>
            <button type="button" id="btn-save-all">SALVA</button>
            <button type="button" id="btn-reset">Nuovo progetto</button>
        </div>

        <!-- Albero del progetto in costruzione (costruito lato client) -->
        <div id="admin-tree"></div>

        <p id="admin-msg" class="msg"></p>
    </section>

    <!-- =================== VISTA 2: VERIFICA PROGETTI =================== -->
    <section id="view-verify" class="view" hidden>
        <h2>Verifica progetti</h2>

        <!-- Struttura del progetto in costruzione (default) -->
        <div id="verify-draft"></div>

        <hr>

        <div class="row">
            <label for="verify-select">Progetto salvato:</label>
            <select id="verify-select"><option value="">Seleziona un progetto salvato...</option></select>
        </div>
        <div id="verify-struct"></div>

        <p id="verify-msg" class="msg"></p>
    </section>

</body>
</html>
